name: CI Pipeline

on:
  push:
    branches: [ "main", "lab" ]
  pull_request:
    branches: [ "main", "lab" ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------
  # 1. Тестування та лінтинг сервісів (Build & Test + Lint)
  # -------------------------------------------------------------
  test-services:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Падіння одного сервісу не скасовує інші
      matrix:
        include:
          # Python: shipments-service
          - service: shipments-service
            path: services/shipments-service
            type: python
          # Go: tracking-service
          - service: tracking-service
            path: services/tracking-service
            type: go
          # Node/TS: gateway
          - service: gateway
            path: services/gateway
            type: node
          # Node/TS/React: web
          - service: web
            path: web
            type: node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Налаштування для Python ---
      - name: Setup Python
        if: matrix.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ${{ matrix.path }}/requirements*.txt

      - name: Lint & Test Python
        if: matrix.type == 'python'
        run: |
          cd ${{ matrix.path }}
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest
          # Статичний аналіз (блокуючий крок)
          ruff check .
          # Тести
          pytest

      # --- Налаштування для Go ---
      - name: Setup Go
        if: matrix.type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: ${{ matrix.path }}/go.sum

      - name: Lint & Test Go
        if: matrix.type == 'go'
        run: |
          cd ${{ matrix.path }}
          # Статичний аналіз
          go vet ./...
          # Тести
          go test -v ./...

      # --- Налаштування для Node.js ---
      - name: Setup Node.js
        if: matrix.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Lint & Test Node.js
        if: matrix.type == 'node'
        run: |
          cd ${{ matrix.path }}
          npm ci
          # Запуск лінтера (якщо налаштований у package.json)
          npm run lint --if-present
          # Тести
          npm test --if-present

  # -------------------------------------------------------------
  # 2. Збірка, сканування та публікація Docker-образів
  # -------------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    needs: test-services  # Виконується тільки після успішних тестів
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - shipments-service
          - tracking-service
          - gateway
          - web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker context and file
        id: meta-path
        run: |
          if [ "${{ matrix.service }}" = "web" ]; then
            echo "context=web" >> $GITHUB_OUTPUT
            echo "dockerfile=web/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "context=services/${{ matrix.service }}" >> $GITHUB_OUTPUT
            echo "dockerfile=services/${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT
          fi

      # Генерація тегів: sha і latest (лише для гілки за замовчуванням)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Збірка образу локально в runner (без push)
      - name: Build image locally
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.meta-path.outputs.context }}
          file: ${{ steps.meta-path.outputs.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}

      # Сканування образу на вразливості за допомогою Trivy
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'table'
          exit-code: '0' # Встановіть '1', якщо бажаєте блокувати пайплайн при CRITICAL-вразливостях
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Автентифікація в GHCR (лише при push у гілку, не для PR)
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Публікація образу в GHCR
      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.meta-path.outputs.context }}
          file: ${{ steps.meta-path.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
