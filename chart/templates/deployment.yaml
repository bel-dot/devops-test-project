apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cartservice.fullname" . }}
  labels:
    {{- include "cartservice.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cartservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cartservice.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cartservice.fullname" . }}-config
                  key: PORT
            - name: LISTEN_ADDR
              valueFrom:
                configMapKeyRef:
                  name: {{ include "cartservice.fullname" . }}-config
                  key: LISTEN_ADDR
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ include "cartservice.fullname" . }}-secret
                  key: REDIS_ADDR
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
