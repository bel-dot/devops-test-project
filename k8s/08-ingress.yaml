apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cartservice-ingress
  namespace: devops-biliakov
  annotations:
    ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cartservice
                port:
                  number: 8080
